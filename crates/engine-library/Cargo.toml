[package]
name = "engine-library"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Engine DJ collection database, audio metadata, artwork and backup operations"

[dependencies]
audio-metadata = { path = "../../../fetch-track-cli/crates/audio-metadata" }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
lofty = "0.25"
hex = "0.4"
flate2 = "1.1.10"
uuid = { version = "1.28", features = ["v4", "serde"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "backup", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["process", "macros", "rt-multi-thread", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
walkdir = "2"

